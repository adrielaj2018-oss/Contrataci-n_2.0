services:
  - type: web
    name: portal-hr-pro-contratacion
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: APP_TIMEZONE
        value: America/Lima
      - key: SECRET_KEY
        generateValue: true
